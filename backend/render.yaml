services:
  - type: web
    name: sudhixai-backend
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "sudhixai-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sudhixai.com,https://www.sudhixai.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sudhixai.com,https://www.sudhixai.com"
      # The database variables will be filled manually in Render dashboard
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
